<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* bold condensed type, no boxes: white with warm gold on the key word, a soft dark halo so it reads on the bright roof */
:root{--ink:#FFFFFF;--gold:#FFC54D;--halo:0 2px 2px rgba(12,14,18,.55),0 4px 16px rgba(12,14,18,.55),0 0 42px rgba(12,14,18,.35);
  --goldhalo:0 2px 2px rgba(40,22,0,.6),0 4px 16px rgba(30,18,4,.55),0 0 42px rgba(30,18,4,.35)}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:transparent}
*{box-sizing:border-box}
/* top titles: inside x 140-940, top >= 250 (clear of the IG header) */
#tt{position:absolute;left:140px;right:140px;top:250px;text-align:center;visibility:hidden;transform-origin:50% 0}
#k{display:inline-flex;align-items:center;gap:18px;font:600 36px/1.2 'Oswald';text-transform:uppercase;letter-spacing:.2em;color:var(--ink);text-shadow:var(--halo);margin-bottom:10px;white-space:nowrap}
#k i{display:block;height:3px;width:56px;background:var(--gold);box-shadow:0 2px 8px rgba(20,12,0,.5);transform-origin:right}
#k i+span+i{transform-origin:left}
.ln{display:block;font:400 98px/1.0 'Anton';text-transform:uppercase;color:var(--ink);letter-spacing:.012em;white-space:nowrap}
.ln span{display:inline-block;margin:0 .1em;text-shadow:var(--halo);will-change:transform}
.ln span.g{color:var(--gold);text-shadow:var(--goldhalo)}
#tt.s1 .ln{font-size:104px}
#tt.s2 .ln{font-size:150px;line-height:.95}
#ul{display:block;margin:10px auto 0;height:9px;width:0;border-radius:5px;background:var(--gold);box-shadow:0 3px 12px rgba(20,12,0,.5)}
/* captions: on the chest, 1-3 words, condensed caps */
#cap{position:absolute;left:120px;right:120px;top:1330px;text-align:center;visibility:hidden}
#cap span{display:inline-block;font:700 74px/1.05 'Oswald';text-transform:uppercase;letter-spacing:.01em;color:var(--ink);margin:0 12px;text-shadow:var(--halo)}
#cap span.e{color:var(--gold);text-shadow:var(--goldhalo)}
#cap span.f{opacity:.62}
</style></head>
<body>
<div id="tt"><div id="k"><i></i><span id="kt"></span><i></i></div><div id="lines"></div><span id="ul"></span></div>
<div id="cap"></div>
<script src="data.js"></script>
<script>
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)), lin=(t,a,b)=>cl((t-a)/(b-a));
const out3=x=>1-Math.pow(1-x,3), back=x=>{const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
let cur=null, spans=[];
function render(t){
  // titles: kicker draws out from the centre, then each word punches in (big, blurred -> sharp) on its spoken word,
  // gold words land with an extra kick; the block slowly pushes in while up, then lifts away
  {const h=HL.find(h=>t>=h.from&&t<h.to), el=$('tt');
   if(!h){el.style.visibility='hidden';cur=null}
   else{
     if(cur!==h.id){$('kt').textContent=h.k;el.className='s'+h.size;
       $('lines').innerHTML=h.lines.map(l=>'<span class="ln">'+l.map(w=>`<span class="${w.g?'g':''}">${w.w}</span>`).join('')+'</span>').join('');
       spans=[...$('lines').querySelectorAll('.ln span')];cur=h.id}
     const words=h.lines.flat(), o=1-lin(t,h.to-.28,h.to), lift=(1-o)*-22;
     el.style.visibility='visible';el.style.opacity=o;
     el.style.transform=`translateY(${lift}px) scale(${1+.035*lin(t,h.from,h.to)})`;
     const k=out3(lin(t,h.from,h.from+.35));$('k').style.opacity=k;$('k').style.transform=`translateY(${(1-k)*14}px)`;
     $('k').querySelectorAll('i').forEach(i=>i.style.transform=`scaleX(${out3(lin(t,h.from+.1,h.from+.5))})`);
     words.forEach((w,i)=>{const s=spans[i];if(!s)return;const u=lin(t,w.t-.04,w.t+.24);const b=back(u);
       s.style.opacity=cl(u*2.2);s.style.filter=u<1?`blur(${(1-u)*9}px)`:'none';
       s.style.transform=`scale(${(w.g?1.9:1.55)-(w.g?.9:.55)*b}) translateY(${(1-out3(u))*-18}px)`;});
     // gold underline sweeps under the last line once the last word has landed
     const last=words[words.length-1].t, ul=out3(lin(t,last+.2,last+.55)), lw=$('lines').lastChild.getBoundingClientRect().width;
     $('ul').style.width=(ul*Math.min(lw*.62,520))+'px';$('ul').style.opacity=ul>0?1:0;}}
  // captions: one to three words; the chunk rises in on its first word, words not yet said stay dim
  {const cap=$('cap');let k=-1;for(let j=0;j<CAPS.length;j++)if(CAPS[j][0].s<=t+.03)k=j;
   const c=k>=0?CAPS[k]:null, nx=k+1<CAPS.length?CAPS[k+1][0].s:END, last=c?c[c.length-1].s+.9:0;
   if(!c||t>Math.min(nx,last+.35)){cap.style.visibility='hidden'}
   else{cap.innerHTML=c.map(w=>`<span class="${w.e?'e':''}${w.s>t+.03?' f':''}">${w.t}</span>`).join('');
     const p=out3(lin(t,c[0].s,c[0].s+.14));cap.style.visibility='visible';cap.style.opacity=p;cap.style.transform=`translateY(${(1-p)*16}px) scale(${.94+.06*p})`;}}
}
window.render=render;render(0);
</script>
</body></html>
